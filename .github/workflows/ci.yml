name: Lunar CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core and service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-core-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo check -p lunar-utils -p lunar-structures -p lunar-stellar-core -p lunar-backend -p lunar-start -p lunar-start-backend
      - run: cargo test -p lunar-stellar-core -p lunar-start -p lunar-start-backend
      - run: cargo clippy -p lunar-utils -p lunar-structures -p lunar-stellar-core -p lunar-backend -p lunar-start -p lunar-start-backend --all-targets

  frontend-web:
    name: Frontend web check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: frontend-web-${{ hashFiles('Cargo.lock') }}
      - run: cargo check -p lunar-frontend --target wasm32-unknown-unknown --no-default-features --features web

  frontend-native:
    name: Frontend desktop check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: frontend-native-${{ hashFiles('Cargo.lock') }}
      - run: cargo check -p lunar-frontend --no-default-features --features desktop

  webos-check:
    name: WebOS CSS and state tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testbench/lunar-testbench/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: webos-${{ hashFiles('Cargo.lock', 'testbench/lunar-testbench/package-lock.json') }}
      - run: npm ci
        working-directory: testbench/lunar-testbench
      - run: npm run build:css
        working-directory: testbench/lunar-testbench
      - run: cargo test -p lunar-testbench --bin lunar-testbench

  webos-e2e:
    name: WebOS browser E2E (configured environment)
    if: ${{ vars.LUNAR_E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testbench/lunar-testbench/package-lock.json
      - run: npm ci
        working-directory: testbench/lunar-testbench
      - run: npx playwright install --with-deps chromium
        working-directory: testbench/lunar-testbench
      - run: npm run test:e2e
        working-directory: testbench/lunar-testbench
        env:
          LUNAR_E2E_BASE_URL: ${{ vars.LUNAR_E2E_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webos-e2e-artifacts
          path: |
            testbench/lunar-testbench/test-results
            testbench/lunar-testbench/playwright-report

  android-smoke:
    name: Android smoke (toolchain-enabled environment)
    if: ${{ github.event_name == 'workflow_dispatch' && vars.LUNAR_ENABLE_ANDROID_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android frontend
        run: dx build --platform android
