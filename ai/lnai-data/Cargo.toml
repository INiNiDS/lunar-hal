[package]
name = "lnai-data"
version.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
lunar-utils = { path = "../../crates/lunar-utils" }
sha2 = "0.11.0"
serde_json = "1"
reqwest = { version = "0.13.4", features = ["blocking", "query", "form", "native-tls"] }
polars = { version = "0.55.2", features = ["lazy", "csv", "parquet", "trigonometry"] }
polars-buffer = "0.55.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
