[package]
name = "lunar-ai-cli"
version.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
clap = {version = "4.6.1", features = ["derive"]}
reqwest = { version = "0.13.4", features = ["blocking", "query", "form", "native-tls", "cookies"] }
polars = { version = "0.55.2", features = ["lazy", "csv", "parquet", "trigonometry"] }
anyhow = "1.0.102"
rand = "0.10.1"
sha2 = "0.11.0"
serde_json = "1"
lnai-data = { path = "../lnai-data" }
lnai-training = { path = "../lnai-training" }
[[bin]]
name = "lnaicli"
path = "src/main.rs"
