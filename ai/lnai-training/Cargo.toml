[package]
name = "lnai-training"
version.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3"
lunar-utils = { path = "../../crates/lunar-utils" }
sha2 = "0.11.0"
polars = { version = "0.55.2", features = ["lazy", "csv", "parquet", "trigonometry", "abs"] }
rand = "0.10.1"
rayon = "1.12"
burn = { version = "0.21", features = ["std", "train", "cuda", "autodiff", "fusion", "autotune"] }
burn-store = { version = "0.21", features = ["safetensors", "burnpack"] }
lnai-models = { path = "../lnai-models", features = ["pinn", "gnn", "siren", "localization"] }

[dev-dependencies]
criterion = "0.7"
tempfile = "3"
polars = { version = "0.55.2", features = ["lazy", "parquet"] }
lnai-models = { path = "../lnai-models", features = ["pinn", "gnn", "siren", "localization"] }
lnai-data = { path = "../lnai-data" }
burn = { version = "0.21", features = ["ndarray"] }

[features]
default = []
pinn = ["lnai-models/pinn"]
gnn = ["lnai-models/gnn"]
siren = ["lnai-models/siren"]
localization = ["lnai-models/localization"]
cuda = []
wgpu = []
cpu = []
gpu-harness = []

[lints]
workspace = true

[[bench]]
name = "pinn_forward"
harness = false

[[bench]]
name = "gnn_graph"
harness = false

[[bench]]
name = "siren_texture"
harness = false

[[bench]]
name = "localization"
harness = false

[[bench]]
name = "gpu_synchronized"
harness = false
required-features = ["gpu-harness"]
