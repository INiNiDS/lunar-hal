[package]
name = "lnai-training"
version.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
lunar-utils = { path = "../../crates/lunar-utils" }
sha2 = "0.11.0"

[dev-dependencies]
criterion = "0.7"
polars = { version = "0.53.0", features = ["lazy", "parquet"] }
lnai-models = { path = "../lnai-models", features = ["pinn", "gnn", "siren", "localization"] }
lnai-data = { path = "../lnai-data" }
burn = { version = "0.21", features = ["ndarray"] }

[features]
default = []
gpu-harness = []

[lints]
workspace = true

[[bench]]
name = "pinn_forward"
harness = false

[[bench]]
name = "gnn_graph"
harness = false

[[bench]]
name = "siren_texture"
harness = false

[[bench]]
name = "localization"
harness = false

[[bench]]
name = "gpu_synchronized"
harness = false
required-features = ["gpu-harness"]
